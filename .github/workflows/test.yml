name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uvx ruff check aiosxm tests

      - name: Check formatting
        run: uvx ruff format --check aiosxm tests

      - name: Type check
        run: uvx mypy aiosxm --ignore-missing-imports

      - name: Test
        run: uv run pytest --cov=aiosxm --cov-report=term-missing
